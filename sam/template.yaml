AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Virtual Me v2 Chatbot - Main Stack

Parameters:
  DomainName:
    Type: String
    Default: lemaire.tel
    Description: Root domain name

  FrontendSubdomain:
    Type: String
    Default: chat
    Description: Subdomain for frontend

  ApiSubdomain:
    Type: String
    Default: api
    Description: Subdomain for API

  LlmModel:
    Type: String
    Default: nova-2-lite
    Description: LLM model identifier for Bedrock

  LlmTemperature:
    Type: String
    Default: '0.1'
    Description: LLM temperature (0.0-1.0)

  Route53ZoneId:
    Type: String
    Description: Route53 hosted zone ID for the domain

  ApiCertificateArn:
    Type: String
    Description: ACM certificate ARN for API (regional, eu-west-3)

  CloudFrontCertificateArn:
    Type: String
    Description: ACM certificate ARN for CloudFront (must be in us-east-1)

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: CloudWatch log retention in days

  AlarmEmail:
    Type: String
    Description: Email address for alarm notifications

Resources:
  StorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/storage.yaml
      Tags:
        - Key: Project
          Value: VirtualMe

  ComputeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/compute.yaml
      Parameters:
        LlmModel: !Ref LlmModel
        LlmTemperature: !Ref LlmTemperature
        DomainName: !Ref DomainName
        FrontendSubdomain: !Ref FrontendSubdomain
        ApiSubdomain: !Ref ApiSubdomain
        Route53ZoneId: !Ref Route53ZoneId
        ApiCertificateArn: !Ref ApiCertificateArn
        LogRetentionDays: !Ref LogRetentionDays
        KnowledgeBaseId: !GetAtt StorageStack.Outputs.KnowledgeBaseId
        KnowledgeBaseArn: !GetAtt StorageStack.Outputs.KnowledgeBaseArn
      Tags:
        - Key: Project
          Value: VirtualMe

  FrontendStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/frontend.yaml
      Parameters:
        FrontendSubdomain: !Ref FrontendSubdomain
        DomainName: !Ref DomainName
        Route53ZoneId: !Ref Route53ZoneId
        CloudFrontCertificateArn: !Ref CloudFrontCertificateArn
      Tags:
        - Key: Project
          Value: VirtualMe

  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/monitoring.yaml
      Parameters:
        VirtualMeFunctionName: !GetAtt ComputeStack.Outputs.FunctionName
        VirtualMeApiId: !GetAtt ComputeStack.Outputs.ApiId
        AlarmEmail: !Ref AlarmEmail
      Tags:
        - Key: Project
          Value: VirtualMe

Outputs:
  FunctionName:
    Description: Lambda function name
    Value: !GetAtt ComputeStack.Outputs.FunctionName

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ComputeStack.Outputs.FunctionArn

  ApiEndpoint:
    Description: HTTP API endpoint URL
    Value: !GetAtt ComputeStack.Outputs.ApiEndpoint

  ApiId:
    Description: HTTP API ID
    Value: !GetAtt ComputeStack.Outputs.ApiId

  FrontendUrl:
    Description: Frontend URL
    Value: !GetAtt FrontendStack.Outputs.FrontendUrl

  FrontendBucketName:
    Description: S3 bucket name for frontend files
    Value: !GetAtt FrontendStack.Outputs.FrontendBucketName

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !GetAtt FrontendStack.Outputs.CloudFrontDistributionId

  CloudFrontDomainName:
    Description: CloudFront domain name
    Value: !GetAtt FrontendStack.Outputs.CloudFrontDomainName

  KnowledgeBaseId:
    Description: Bedrock Knowledge Base ID
    Value: !GetAtt StorageStack.Outputs.KnowledgeBaseId

  KnowledgeBaseBucketName:
    Description: S3 bucket for knowledge base documents
    Value: !GetAtt StorageStack.Outputs.KnowledgeBaseBucketName

  DataSourceId:
    Description: Bedrock Data Source ID
    Value: !GetAtt StorageStack.Outputs.DataSourceId

  SNSTopicArn:
    Description: SNS topic ARN for alarm notifications
    Value: !GetAtt MonitoringStack.Outputs.SNSTopicArn
